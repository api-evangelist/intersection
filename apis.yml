apis:
- name: Intersection Order Management System (OMS) API
  description: 'Intersection''s AI-powered Order Management System for out-of-home
    advertising. Announced 2026-05-11, it is a single API over Intersection''s digital
    screen inventory (LinkNYC and other street, transit, air and place-based networks,
    7,000+ digital screens across 13 U.S. markets) covering inventory discovery, real-time
    availability and pricing, media-plan construction and campaign reservation, with
    human-in-the-loop approval before final booking. Standards-based: built on the
    IAB Tech Lab OpenDirect 2.0 specification. Reachable by agents through an MCP server.
    The surface is in beta and access is arranged by contacting Intersection directly;
    no public developer portal, base URL, or machine-readable contract is published
    as of the probe date.'
  humanURL: https://www.intersection.com/announcement/intersection-opens-extensive-street-level-ooh-network-to-ai-agents-for-planning-and-booking/
