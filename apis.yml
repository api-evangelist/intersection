aid: intersection
name: Intersection
description: 'Intersection is a New York-based, experience-driven out-of-home (OOH)
  media and technology company formed from the merger of Titan, a municipal out-of-home
  advertising operator, and Control Group, a technology and design studio. It operates
  street-level, transit, airport, bikeshare and place-based advertising networks across
  13 major U.S. markets - including LinkNYC, the largest street-level digital network
  in New York City - and it builds the software behind them: the IxNConnect display-management
  and communications platform used by cities, transit agencies and airports, and an
  AI-powered Order Management System (OMS) that exposes inventory discovery, availability,
  pricing and campaign reservation to AI agents through an MCP server built on the
  IAB Tech Lab OpenDirect 2.0 specification.'
